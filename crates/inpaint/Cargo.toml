[package]
name = "lightcraft-inpaint"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "Native Stable Diffusion inpainting (L3)"

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
lightcraft-fetch = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
candle-core = { workspace = true, features = ["metal"] }
candle-nn = { workspace = true, features = ["metal"] }
candle-transformers = { workspace = true, features = ["metal"] }
